<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Amikin Survival Clone</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; user-select: none; }
        body { background: #121a13; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Yuqori panel */
        #hud-top {
            position: fixed; top: 12px; left: 12px; right: 12px;
            display: flex; justify-content: space-between; align-items: flex-start;
            pointer-events: none; z-index: 10;
        }
        .stats-box {
            background: rgba(15, 25, 18, 0.85); border: 2px solid #4caf50;
            padding: 10px 15px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hp-bar-bg { width: 160px; height: 12px; background: #333; border-radius: 6px; overflow: hidden; margin-bottom: 6px; }
        #hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff5252, #4caf50); transition: width 0.2s; }
        .res-row { display: flex; gap: 12px; font-size: 14px; font-weight: bold; }

        /* Xabarlar oynasi */
        #toast {
            position: fixed; top: 85px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.75); color: #ffeb3b; padding: 8px 18px;
            border-radius: 20px; font-size: 14px; pointer-events: none; z-index: 10;
            border: 1px solid rgba(255,235,59,0.3); text-align: center;
        }

        /* Pastki boshqaruv tugmalari (Kompyuter va Telefon uchun) */
        #controls-bottom {
            position: fixed; bottom: 18px; right: 18px;
            display: flex; flex-wrap: wrap; gap: 10px; z-index: 10; max-width: 340px; justify-content: flex-end;
        }
        .action-btn {
            background: rgba(25, 40, 28, 0.9); color: #fff; border: 2px solid #81c784;
            padding: 12px 14px; border-radius: 12px; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: transform 0.1s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .action-btn:active { transform: scale(0.93); background: #2e7d32; }
        .btn-attack { border-color: #ff7043; background: rgba(60, 25, 20, 0.9); }
        .btn-tame { border-color: #29b6f6; background: rgba(15, 45, 65, 0.9); }

        #help-text {
            position: fixed; bottom: 18px; left: 18px;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 8px;
            font-size: 12px; color: #b9f6ca; pointer-events: none;
        }
    </style>
</head>
<body>

<div id="hud-top">
    <div class="stats-box">
        <div class="hp-bar-bg"><div id="hp-bar-fill"></div></div>
        <div class="res-row">
            <span>🪵 <span id="ui-wood">0</span></span>
            <span>🪨 <span id="ui-stone">0</span></span>
            <span>🔮 <span id="ui-spheres">3</span></span>
            <span>🐾 <span id="ui-pets">0</span></span>
        </div>
    </div>
    <div class="stats-box" style="text-align: right;">
        <div style="font-size: 13px; color: #a5d6a7;">Baza darajasi: <span id="ui-base-lvl">1</span></div>
        <div style="font-size: 12px; color: #ccc;">Daraxt kesing, monstr tuting, baza quring!</div>
    </div>
</div>

<div id="toast">Harakatlanish: WASD / Strelkalar yoki ekranga bosing</div>

<div id="help-text">
    <b>WASD:</b> Yurish | <b>Space:</b> Zarba | <b>E:</b> Tutish | <b>B:</b> Devor | <b>H:</b> Uy/Baza | <b>C:</b> Shar
</div>

<div id="controls-bottom">
    <button class="action-btn btn-attack" onclick="playerAttack()">⚔️ Zarba (Space)</button>
    <button class="action-btn btn-tame" onclick="tryTame()">🔮 Tutish (E)</button>
    <button class="action-btn" onclick="buildWall()">🧱 Devor [10🪵] (B)</button>
    <button class="action-btn" onclick="buildBaseHut()">🏠 Baza [25🪵 15🪨] (H)</button>
    <button class="action-btn" onclick="craftSphere()">✨ Shar [5🪵 5🪨] (C)</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Katta dunyo o'lchami
const WORLD_SIZE = 2200;

const player = {
    x: WORLD_SIZE / 2,
    y: WORLD_SIZE / 2,
    r: 20,
    speed: 4,
    hp: 100,
    maxHp: 100,
    wood: 10,
    stone: 5,
    spheres: 3,
    dirX: 0,
    dirY: 1,
    attackCd: 0,
    targetX: null,
    targetY: null
};

const keys = {};
const resources = [];
const monsters = [];
const buildings = [];
const particles = [];

let baseLevel = 1;
let toastTimer = null;

function showToast(msg) {
    const el = document.getElementById("toast");
    el.innerText = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
        el.innerText = "Yovvoyi monstr jonini 40% dan kamaytirib, 'E' bilan tuting!";
    }, 3500);
}

// Dunyoni resurs va monstrlar bilan to'ldirish
function initWorld() {
    // Boshlang'ich gulxan (Baza markazi)
    buildings.push({
        type: "campfire",
        x: player.x - 70,
        y: player.y - 40,
        w: 44, h: 44
    });

    // Daraxt va toshlar
    for (let i = 0; i < 65; i++) {
        spawnResource();
    }

    // Turli xil Amikin monstrlari
    const types = [
        { name: "Flamik", color: "#ff5722", hp: 100, dmg: 8 },
        { name: "Aquarin", color: "#03a9f4", hp: 110, dmg: 7 },
        { name: "Verdant", color: "#8bc34a", hp: 90, dmg: 6 },
        { name: "Voltik", color: "#ffc107", hp: 120, dmg: 10 },
        { name: "Shadow", color: "#9c27b0", hp: 140, dmg: 12 }
    ];

    for (let i = 0; i < 18; i++) {
        const t = types[i % types.length];
        let mx = Math.random() * (WORLD_SIZE - 200) + 100;
        let my = Math.random() * (WORLD_SIZE - 200) + 100;
        if (Math.hypot(mx - player.x, my - player.y) < 250) mx += 300;

        monsters.push({
            name: t.name,
            color: t.color,
            x: mx, y: my,
            r: 18,
            hp: t.hp, maxHp: t.hp,
            dmg: t.dmg,
            tamed: false,
            vx: 0, vy: 0,
            aiTimer: 0,
            attackCd: 0
        });
    }
}

function spawnResource() {
    const isTree = Math.random() > 0.4;
    resources.push({
        type: isTree ? "tree" : "rock",
        x: Math.random() * (WORLD_SIZE - 120) + 60,
        y: Math.random() * (WORLD_SIZE - 120) + 60,
        r: isTree ? 26 : 22,
        hp: 60,
        maxHp: 60
    });
}

function addParticles(x, y, color, count = 8) {
    for (let i = 0; i < count; i++) {
        particles.push({
            x, y,
            vx: (Math.random() - 0.5) * 6,
            vy: (Math.random() - 0.5) * 6,
            life: 25,
            color
        });
    }
}

// O'yinchi hujumi / Resurs kesish
function playerAttack() {
    if (player.attackCd > 0) return;
    player.attackCd = 18;

    const hitX = player.x + player.dirX * 36;
    const hitY = player.y + player.dirY * 36;
    addParticles(hitX, hitY, "#ffffff", 5);

    // Resurslarni urish
    for (let i = resources.length - 1; i >= 0; i--) {
        const res = resources[i];
        if (Math.hypot(hitX - res.x, hitY - res.y) < res.r + 28) {
            res.hp -= 20;
            addParticles(res.x, res.y, res.type === "tree" ? "#4caf50" : "#bdbdbd", 6);
            if (res.hp <= 0) {
                if (res.type === "tree") {
                    player.wood += 6;
                    showToast("+6 Yogʻoch yigʻildi!");
                } else {
                    player.stone += 5;
                    showToast("+5 Tosh yigʻildi!");
                }
                resources.splice(i, 1);
                setTimeout(spawnResource, 5000);
            }
        }
    }

    // Yovvoyi monstrlarni urish
    monsters.forEach(m => {
        if (!m.tamed && Math.hypot(hitX - m.x, hitY - m.y) < m.r + 28) {
            m.hp -= 22;
            addParticles(m.x, m.y, "#ff1744", 7);
            if (m.hp < 12) m.hp = 12; // Tutish uchun imkon qoldirish
            showToast(`${m.name} joni: ${m.hp}/${m.maxHp}. Tutish uchun 'E' bosing!`);
        }
    });
}

// Monstrni shar bilan tutish
function tryTame() {
    if (player.spheres <= 0) {
        showToast("Shar qolmadi! 'C' tugmasi bilan yangi shar yasang.");
        return;
    }

    let nearest = null;
    let minDist = 95;
    monsters.forEach(m => {
        if (!m.tamed) {
            const d = Math.hypot(player.x - m.x, player.y - m.y);
            if (d < minDist) {
                minDist = d;
                nearest = m;
            }
        }
    });

    if (!nearest) {
        showToast("Yaqin atrofda yovvoyi monstr yoʻq!");
        return;
    }

    if (nearest.hp <= nearest.maxHp * 0.45) {
        player.spheres--;
        nearest.tamed = true;
        nearest.hp = nearest.maxHp;
        addParticles(nearest.x, nearest.y, "#00e5ff", 18);
        showToast(`🎉 ${nearest.name} qoʻlga olindi! Endi u sizga yordam beradi.`);
    } else {
        showToast(`${nearest.name}ni tutish uchun avval urib jonini 45% dan kamaytiring!`);
    }
}

// Devor qurish
function buildWall() {
    if (player.wood >= 10) {
        player.wood -= 10;
        buildings.push({
            type: "wall",
            x: player.x + player.dirX * 42 - 20,
            y: player.y + player.dirY * 42 - 20,
            w: 40, h: 40
        });
        showToast("🧱 Yogʻoch devor qurildi!");
    } else {
        showToast("Devor uchun 10 ta yogʻoch kerak!");
    }
}

// Baza uyi qurish (Jonni tiklaydi va baza darajasini oshiradi)
function buildBaseHut() {
    if (player.wood >= 25 && player.stone >= 15) {
        player.wood -= 25;
        player.stone -= 15;
        baseLevel++;
        buildings.push({
            type: "hut",
            x: player.x + player.dirX * 55 - 35,
            y: player.y + player.dirY * 55 - 35,
            w: 70, h: 70
        });
        showToast(`🏠 Baza uyi qurildi! Baza darajasi: ${baseLevel}`);
    } else {
        showToast("Baza uyi uchun 25 yogʻoch va 15 tosh kerak!");
    }
}

// Shar yasash
function craftSphere() {
    if (player.wood >= 5 && player.stone >= 5) {
        player.wood -= 5;
        player.stone -= 5;
        player.spheres++;
        showToast("🔮 Yangi tutuvchi shar yasaldi!");
    } else {
        showToast("Shar yasash uchun 5 yogʻoch va 5 tosh kerak!");
    }
}

// Klaviatura va sichqoncha/sensor boshqaruvi
window.addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    keys[k] = true;
    player.targetX = null;
    if (e.code === "Space") playerAttack();
    if (k === "e") tryTame();
    if (k === "b") buildWall();
    if (k === "h") buildBaseHut();
    if (k === "c") craftSphere();
});
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

canvas.addEventListener("pointerdown", e => {
    const camX = player.x - canvas.width / 2;
    const camY = player.y - canvas.height / 2;
    player.targetX = e.clientX + camX;
    player.targetY = e.clientY + camY;
});

// O'yin mantig'ini yangilash
function update() {
    if (player.attackCd > 0) player.attackCd--;

    // Harakatlanish (Klaviatura yoki bosilgan nuqtaga yurish)
    let dx = 0, dy = 0;
    if (keys["w"] || keys["arrowup"]) dy -= 1;
    if (keys["s"] || keys["arrowdown"]) dy += 1;
    if (keys["a"] || keys["arrowleft"]) dx -= 1;
    if (keys["d"] || keys["arrowright"]) dx += 1;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        dx /= len; dy /= len;
        player.dirX = dx;
        player.dirY = dy;
        player.x += dx * player.speed;
        player.y += dy * player.speed;
    } else if (player.targetX !== null) {
        const dist = Math.hypot(player.targetX - player.x, player.targetY - player.y);
        if (dist > 8) {
            dx = (player.targetX - player.x) / dist;
            dy = (player.targetY - player.y) / dist;
            player.dirX = dx;
            player.dirY = dy;
            player.x += dx * player.speed;
            player.y += dy * player.speed;
        } else {
            player.targetX = null;
        }
    }

    player.x = Math.max(30, Math.min(WORLD_SIZE - 30, player.x));
    player.y = Math.max(30, Math.min(WORLD_SIZE - 30, player.y));

    // Baza (gulxan yoki uy) yonida jon tiklanishi
    buildings.forEach(b => {
        if ((b.type === "campfire" || b.type === "hut") &&
            Math.hypot(player.x - (b.x + b.w/2), player.y - (b.y + b.h/2)) < 90) {
            if (player.hp < player.maxHp) player.hp = Math.min(player.maxHp, player.hp + 0.15);
        }
    });

    // Monstrlar AI
    monsters.forEach(m => {
        if (m.attackCd > 0) m.attackCd--;

        if (m.tamed) {
            // 1. Yaqin yovvoyi monstrga hujum qilishga yordam berish
            let enemy = monsters.find(other => !other.tamed && Math.hypot(other.x - player.x, other.y - player.y) < 180);
            if (enemy) {
                const d = Math.hypot(enemy.x - m.x, enemy.y - m.y);
                if (d > 35) {
                    m.x += ((enemy.x - m.x) / d) * 3.4;
                    m.y += ((enemy.y - m.y) / d) * 3.4;
                } else if (m.attackCd === 0) {
                    m.attackCd = 45;
                    enemy.hp = Math.max(10, enemy.hp - m.dmg);
                    addParticles(enemy.x, enemy.y, "#00e5ff", 4);
                }
                return;
            }

            // 2. Yaqin daraxt/toshni avtomatik yig'ish
            let nearRes = resources.find(r => Math.hypot(r.x - player.x, r.y - player.y) < 150);
            if (nearRes) {
                const d = Math.hypot(nearRes.x - m.x, nearRes.y - m.y);
                if (d > 38) {
                    m.x += ((nearRes.x - m.x) / d) * 3.2;
                    m.y += ((nearRes.y - m.y) / d) * 3.2;
                } else if (m.attackCd === 0) {
                    m.attackCd = 50;
                    nearRes.hp -= 15;
                    addParticles(nearRes.x, nearRes.y, "#a5d6a7", 4);
                    if (nearRes.hp <= 0) {
                        if (nearRes.type === "tree") player.wood += 4;
                        else player.stone += 4;
                        resources.splice(resources.indexOf(nearRes), 1);
                        setTimeout(spawnResource, 5000);
                    }
                }
                return;
            }

            // 3. Egasiga ergashish
            const distP = Math.hypot(player.x - m.x, player.y - m.y);
            if (distP > 65) {
                m.x += ((player.x - m.x) / distP) * 3.3;
                m.y += ((player.y - m.y) / distP) * 3.3;
            }
        } else {
            // Yovvoyi monstr: o'yinchi juda yaqin kelsa hujum qiladi
            const distP = Math.hypot(player.x - m.x, player.y - m.y);
            if (distP < 160) {
                if (distP > 36) {
                    m.x += ((player.x - m.x) / distP) * 2.1;
                    m.y += ((player.y - m.y) / distP) * 2.1;
                } else if (m.attackCd === 0) {
                    m.attackCd = 65;
                    player.hp -= m.dmg;
                    addParticles(player.x, player.y, "#ff5252", 6);
                    if (player.hp <= 0) {
                        player.hp = player.maxHp;
                        player.x = WORLD_SIZE / 2;
                        player.y = WORLD_SIZE / 2;
                        showToast("💀 Siz magʻlub boʻldingiz va bazaga qaytdingiz!");
                    }
                }
            } else {
                // Erkin sayr
                m.aiTimer--;
                if (m.aiTimer <= 0) {
                    m.aiTimer = 70 + Math.random() * 80;
                    const ang = Math.random() * Math.PI * 2;
                    m.vx = Math.cos(ang) * 1.1;
                    m.vy = Math.sin(ang) * 1.1;
                }
                m.x = Math.max(40, Math.min(WORLD_SIZE - 40, m.x + m.vx));
                m.y = Math.max(40, Math.min(WORLD_SIZE - 40, m.y + m.vy));
            }
        }
    });

    // Zarrachalar (effektlar)
    for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
    }

    // HUD yangilash
    document.getElementById("hp-bar-fill").style.width = (player.hp / player.maxHp * 100) + "%";
    document.getElementById("ui-wood").innerText = player.wood;
    document.getElementById("ui-stone").innerText = player.stone;
    document.getElementById("ui-spheres").innerText = player.spheres;
    document.getElementById("ui-pets").innerText = monsters.filter(m => m.tamed).length;
    document.getElementById("ui-base-lvl").innerText = baseLevel;
}

// Chizish (Render)
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const camX = player.x - canvas.width / 2;
    const camY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    // Yer foni va kataklar (o'tloq)
    ctx.fillStyle = "#2d5a32";
    ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    ctx.strokeStyle = "rgba(255, 255, 255, 0.05)";
    ctx.lineWidth = 1;
    for (let x = 0; x <= WORLD_SIZE; x += 80) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_SIZE); ctx.stroke();
    }
    for (let y = 0; y <= WORLD_SIZE; y += 80) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(WORLD_SIZE, y); ctx.stroke();
    }

    // Dunyo chegarasi
    ctx.strokeStyle = "#81c784";
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    // Qurilgan binolar
    buildings.forEach(b => {
        if (b.type === "campfire") {
            ctx.fillStyle = "rgba(255, 152, 0, 0.15)";
            ctx.beginPath(); ctx.arc(b.x + 22, b.y + 22, 90, 0, Math.PI * 2); ctx.fill();
            ctx.font = "32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🔥", b.x + 22, b.y + 32);
        } else if (b.type === "wall") {
            ctx.fillStyle = "#6d4c41";
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = "#3e2723";
            ctx.lineWidth = 3;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
        } else if (b.type === "hut") {
            ctx.fillStyle = "rgba(76, 175, 80, 0.15)";
            ctx.beginPath(); ctx.arc(b.x + 35, b.y + 35, 90, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "#8d6e63";
            ctx.fillRect(b.x, b.y, b.w, b.h);
            ctx.strokeStyle = "#ffca28";
            ctx.lineWidth = 3;
            ctx.strokeRect(b.x, b.y, b.w, b.h);
            ctx.font = "36px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("🏠", b.x + 35, b.y + 46);
        }
    });

    // Resurslar
    resources.forEach(r => {
        ctx.beginPath();
        ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
        ctx.fillStyle = r.type === "tree" ? "#1b5e20" : "#616161";
        ctx.fill();
        ctx.font = r.type === "tree" ? "30px sans-serif" : "24px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(r.type === "tree" ? "🌲" : "🪨", r.x, r.y + 9);
    });

    // Monstrlar
    monsters.forEach(m => {
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = m.color;
        ctx.fill();
        ctx.strokeStyle = m.tamed ? "#00e5ff" : "#fff";
        ctx.lineWidth = m.tamed ? 4 : 2;
        ctx.stroke();

        // Nomi
        ctx.fillStyle = "#fff";
        ctx.font = "bold 12px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(m.tamed ? `★ ${m.name}` : m.name, m.x, m.y - 28);

        // Jon chizig'i
        ctx.fillStyle = "rgba(0,0,0,0.6)";
        ctx.fillRect(m.x - 20, m.y - 23, 40, 5);
        ctx.fillStyle = m.tamed ? "#00e676" : "#ff1744";
        ctx.fillRect(m.x - 20, m.y - 23, 40 * (m.hp / m.maxHp), 5);
    });

    // O'yinchi
    ctx.beginPath();
    ctx.arc(player.x, player.y, player.r, 0, Math.PI * 2);
    ctx.fillStyle = "#ffca28";
    ctx.fill();
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 3;
    ctx.stroke();

    // Qurol / yo'nalish
    ctx.beginPath();
    ctx.moveTo(player.x, player.y);
    ctx.lineTo(player.x + player.dirX * 30, player.y + player.dirY * 30);
    ctx.strokeStyle = "#fff";
    ctx.lineWidth = 5;
    ctx.lineCap = "round";
    ctx.stroke();

    // Zarrachalar
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
    });

    ctx.restore();

    // Kichik minixarita (o'ng yuqori burchak ostida)
    const mapSize = 110;
    const mapX = canvas.width - mapSize - 14;
    const mapY = 85;
    ctx.fillStyle = "rgba(10, 20, 12, 0.75)";
    ctx.fillRect(mapX, mapY, mapSize, mapSize);
    ctx.strokeStyle = "#4caf50";
    ctx.lineWidth = 2;
    ctx.strokeRect(mapX, mapY, mapSize, mapSize);

    // Minixaritada o'yinchi va monstrlar
    monsters.forEach(m => {
        ctx.fillStyle = m.tamed ? "#00e5ff" : "#ff5252";
        ctx.fillRect(mapX + (m.x / WORLD_SIZE) * mapSize - 1.5, mapY + (m.y / WORLD_SIZE) * mapSize - 1.5, 3, 3);
    });
    ctx.fillStyle = "#ffeb3b";
    ctx.beginPath();
    ctx.arc(mapX + (player.x / WORLD_SIZE) * mapSize, mapY + (player.y / WORLD_SIZE) * mapSize, 3.5, 0, Math.PI * 2);
    ctx.fill();
}

function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
}

initWorld();
loop();
</script>
</body>
</html>
