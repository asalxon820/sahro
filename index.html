<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oʻyin Dunyosi - 1-bosqich</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; touch-action: none; }
        body { background: #0d1310; color: #fff; overflow: hidden; height: 100vh; width: 100vw; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Yuqori HUD: Hudud nomi va Koordinata */
        #hud-top {
            position: fixed; top: 12px; left: 12px;
            background: rgba(15, 23, 19, 0.85); border: 2px solid #4caf50;
            padding: 10px 16px; border-radius: 12px; pointer-events: none; z-index: 10;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #biome-name { font-size: 16px; font-weight: bold; color: #ffeb3b; }
        #coords { font-size: 12px; color: #b0bec5; margin-top: 3px; }

        /* Sensor Joystik (Telefon uchun) */
        #joystick-zone {
            position: fixed; bottom: 24px; left: 24px; width: 124px; height: 124px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.35); z-index: 15;
            display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob {
            width: 50px; height: 50px; border-radius: 50%;
            background: rgba(76, 175, 80, 0.85); border: 2px solid #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.4);
        }
    </style>
</head>
<body>

<div id="hud-top">
    <div id="biome-name">🌲 Oʻrmon hududi</div>
    <div id="coords">X: 1500 | Y: 1500</div>
</div>

<div id="joystick-zone">
    <div id="joystick-knob"></div>
</div>

<canvas id="world"></canvas>

<script>
const canvas = document.getElementById("world");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

// Dunyo o'lchami (3000 x 3000)
const WORLD_SIZE = 3000;

// Qahramon (O'rmon markazidan boshlaydi)
const player = {
    x: 1500,
    y: 1500,
    speed: 5.5,
    dirX: 0,
    dirY: 1,
    walkAnim: 0
};

// Obyektlar (daraxtlar, kaktuslar, qoyalar, shahar binolari)
const decor = [];

// Qaysi koordinata qaysi zonaga tegishli ekanini aniqlash
function getBiome(x, y) {
    if (y > 2250) return { id: "sea", name: "🌊 Dengiz", color: "#0288d1" };
    if (y < 750) return { id: "snow", name: "🏔️ Qorli Togʻ", color: "#eceff1" };
    if (x < 850) return { id: "desert", name: "🏜️ Choʻl", color: "#e6c27a" };
    if (x > 2150) return { id: "city", name: "🏙️ Shahar", color: "#546e7a" };
    return { id: "forest", name: "🌲 Oʻrmon", color: "#2e6930" };
}

// Dunyoni obyektlar bilan to'ldirish
function generateWorld() {
    // 1. O'rmon daraxtlari (markaz)
    for (let i = 0; i < 90; i++) {
        let x = 900 + Math.random() * 1200;
        let y = 800 + Math.random() * 1350;
        decor.push({ type: "tree", x, y });
    }

    // 2. Cho'l kaktuslari va qum tepaliklari (chap tomon)
    for (let i = 0; i < 65; i++) {
        let x = 60 + Math.random() * 740;
        let y = 800 + Math.random() * 1350;
        decor.push({ type: i % 3 === 0 ? "dune" : "cactus", x, y });
    }

    // 3. Qorli tog' qoyalari va qorli archalar (yuqori tomon)
    for (let i = 0; i < 80; i++) {
        let x = 80 + Math.random() * 2840;
        let y = 60 + Math.random() * 640;
        decor.push({ type: i % 2 === 0 ? "mountain_rock" : "snow_tree", x, y });
    }

    // 4. Shahar binolari va ko'chalari (o'ng tomon)
    for (let gx = 2240; gx <= 2840; gx += 190) {
        for (let gy = 840; gy <= 2050; gy += 190) {
            decor.push({
                type: "building",
                x: gx,
                y: gy,
                w: 115,
                h: 115,
                floors: 2 + Math.floor(Math.random() * 3),
                color: ["#78909c", "#8d6e63", "#607d8b", "#90a4ae"][Math.floor(Math.random() * 4)]
            });
        }
    }

    // 5. Dengiz sohilidagi palmalar va kemacha/toshlar (pastki tomon)
    for (let i = 0; i < 35; i++) {
        let x = 100 + Math.random() * 2800;
        let y = 2190 + Math.random() * 50; // Sohil bo'yi
        decor.push({ type: "palm", x, y });
    }
}

// Klaviatura boshqaruvi
const keys = {};
window.addEventListener("keydown", e => keys[e.key.toLowerCase()] = true);
window.addEventListener("keyup", e => keys[e.key.toLowerCase()] = false);

// Sensor Joystik boshqaruvi
let joyActive = false, joyDx = 0, joyDy = 0;
const joyZone = document.getElementById("joystick-zone");
const joyKnob = document.getElementById("joystick-knob");
const maxJoy = 36;

joyZone.addEventListener("pointerdown", e => {
    joyActive = true;
    joyZone.setPointerCapture(e.pointerId);
    moveJoy(e);
});
joyZone.addEventListener("pointermove", e => { if (joyActive) moveJoy(e); });
function stopJoy() {
    joyActive = false; joyDx = 0; joyDy = 0;
    joyKnob.style.transform = `translate(0px, 0px)`;
}
joyZone.addEventListener("pointerup", stopJoy);
joyZone.addEventListener("pointercancel", stopJoy);

function moveJoy(e) {
    const r = joyZone.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy);
    if (d > maxJoy) { dx = (dx / d) * maxJoy; dy = (dy / d) * maxJoy; }
    joyKnob.style.transform = `translate(${dx}px, ${dy}px)`;
    joyDx = dx / maxJoy;
    joyDy = dy / maxJoy;
}

function update() {
    let dx = 0, dy = 0;
    if (joyActive && Math.hypot(joyDx, joyDy) > 0.12) {
        dx = joyDx; dy = joyDy;
    } else {
        if (keys["w"] || keys["arrowup"]) dy -= 1;
        if (keys["s"] || keys["arrowdown"]) dy += 1;
        if (keys["a"] || keys["arrowleft"]) dx -= 1;
        if (keys["d"] || keys["arrowright"]) dx += 1;
    }

    const biome = getBiome(player.x, player.y);
    // Dengizda biroz sekinroq suzadi
    const currentSpeed = biome.id === "sea" ? player.speed * 0.65 : player.speed;

    if (dx !== 0 || dy !== 0) {
        const len = Math.hypot(dx, dy);
        const nx = dx / len, ny = dy / len;
        const mag = Math.min(1, len);
        player.dirX = nx; player.dirY = ny;
        player.x += nx * currentSpeed * mag;
        player.y += ny * currentSpeed * mag;
        player.walkAnim += 0.25;
    } else {
        player.walkAnim = 0;
    }

    player.x = Math.max(30, Math.min(WORLD_SIZE - 30, player.x));
    player.y = Math.max(30, Math.min(WORLD_SIZE - 30, player.y));

    document.getElementById("biome-name").innerText = biome.name;
    document.getElementById("coords").innerText = `X: ${Math.round(player.x)} | Y: ${Math.round(player.y)}`;
}

// ==================== CHIZISH (RENDER) ====================
function drawWorldZones() {
    // 1. O'rmon (Asosiy yashil fon)
    ctx.fillStyle = "#2e6930";
    ctx.fillRect(0, 0, WORLD_SIZE, WORLD_SIZE);

    // 2. Cho'l (Chap tomon: X 0..850, Y 750..2250)
    ctx.fillStyle = "#e6c27a";
    ctx.fillRect(0, 750, 850, 1500);
    // Cho'l va o'rmon chegarasi (yumshoq qum chizig'i)
    ctx.fillStyle = "#c5b358";
    ctx.fillRect(830, 750, 40, 1500);

    // 3. Shahar (O'ng tomon: X 2150..3000, Y 750..2250)
    ctx.fillStyle = "#455a64";
    ctx.fillRect(2150, 750, 850, 1500);
    // Shahar asfalt ko'chalari
    ctx.fillStyle = "#263238";
    for (let gx = 2215; gx <= 2900; gx += 190) {
        ctx.fillRect(gx - 22, 760, 44, 1480);
    }
    for (let gy = 815; gy <= 2150; gy += 190) {
        ctx.fillRect(2160, gy - 22, 830, 44);
    }

    // 4. Qorli Tog' (Yuqori tomon: X 0..3000, Y 0..750)
    ctx.fillStyle = "#eceff1";
    ctx.fillRect(0, 0, WORLD_SIZE, 750);
    ctx.fillStyle = "#cfd8dc";
    ctx.fillRect(0, 730, WORLD_SIZE, 35);

    // 5. Dengiz va Qumli Sohil (Pastki tomon: Y 2180..3000)
    ctx.fillStyle = "#f4d088"; // Sohil qumi
    ctx.fillRect(0, 2180, WORLD_SIZE, 70);
    ctx.fillStyle = "#0288d1"; // Dengiz suvi
    ctx.fillRect(0, 2250, WORLD_SIZE, 750);

    // Dengiz to'lqinlari animatsiyasi
    const waveOffset = Math.sin(Date.now() * 0.003) * 8;
    ctx.strokeStyle = "rgba(255, 255, 255, 0.35)";
    ctx.lineWidth = 3;
    for (let wx = 40; wx < WORLD_SIZE; wx += 140) {
        for (let wy = 2280; wy < WORLD_SIZE; wy += 120) {
            ctx.beginPath();
            ctx.moveTo(wx + waveOffset, wy);
            ctx.quadraticCurveTo(wx + 35 + waveOffset, wy - 8, wx + 70 + waveOffset, wy);
            ctx.stroke();
        }
    }

    // Dunyo chegarasi
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 8;
    ctx.strokeRect(0, 0, WORLD_SIZE, WORLD_SIZE);
}

function drawDecorItem(d) {
    ctx.save();
    ctx.translate(d.x, d.y);

    if (d.type === "tree") {
        ctx.fillStyle = "rgba(0,0,0,0.28)";
        ctx.beginPath(); ctx.ellipse(0, 22, 24, 9, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#5d4037"; ctx.fillRect(-6, 0, 12, 22);
        ctx.fillStyle = "#1b5e20"; ctx.beginPath(); ctx.arc(0, -6, 23, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#388e3c"; ctx.beginPath(); ctx.arc(-6, -13, 16, 0, Math.PI * 2); ctx.fill();
    } else if (d.type === "cactus") {
        ctx.fillStyle = "rgba(0,0,0,0.2)";
        ctx.beginPath(); ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#2e7d32";
        ctx.beginPath(); ctx.roundRect(-5, -18, 10, 34, 5); ctx.fill();
        ctx.beginPath(); ctx.roundRect(-13, -10, 8, 5, 3); ctx.fill();
        ctx.beginPath(); ctx.roundRect(-13, -16, 5, 10, 3); ctx.fill();
        ctx.beginPath(); ctx.roundRect(5, -6, 8, 5, 3); ctx.fill();
        ctx.beginPath(); ctx.roundRect(8, -13, 5, 10, 3); ctx.fill();
    } else if (d.type === "dune") {
        ctx.fillStyle = "#d4ac63";
        ctx.beginPath();
        ctx.arc(0, 10, 35, Math.PI, 0);
        ctx.fill();
    } else if (d.type === "mountain_rock") {
        ctx.fillStyle = "#78909c";
        ctx.beginPath();
        ctx.moveTo(-34, 20); ctx.lineTo(-12, -28); ctx.lineTo(14, -22); ctx.lineTo(36, 20);
        ctx.closePath(); ctx.fill();
        // Tog' cho'qqisidagi qor
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.moveTo(-12, -28); ctx.lineTo(-20, -10); ctx.lineTo(0, -6); ctx.lineTo(18, -12); ctx.lineTo(14, -22);
        ctx.closePath(); ctx.fill();
    } else if (d.type === "snow_tree") {
        ctx.fillStyle = "#4e342e"; ctx.fillRect(-5, 6, 10, 16);
        ctx.fillStyle = "#37474f";
        ctx.beginPath(); ctx.moveTo(-20, 8); ctx.lineTo(0, -26); ctx.lineTo(20, 8); ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath(); ctx.moveTo(-13, -4); ctx.lineTo(0, -26); ctx.lineTo(13, -4); ctx.fill();
    } else if (d.type === "building") {
        // Bino soyasi
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.fillRect(8, 8, d.w, d.h);
        // Bino tanasi
        ctx.fillStyle = d.color;
        ctx.fillRect(0, 0, d.w, d.h);
        ctx.strokeStyle = "#263238"; ctx.lineWidth = 3;
        ctx.strokeRect(0, 0, d.w, d.h);
        // Derazalar
        ctx.fillStyle = "#fff59d";
        for (let wx = 16; wx < d.w - 20; wx += 28) {
            for (let wy = 16; wy < d.h - 20; wy += 28) {
                ctx.fillRect(wx, wy, 14, 14);
            }
        }
    } else if (d.type === "palm") {
        ctx.fillStyle = "#6d4c41";
        ctx.fillRect(-4, -14, 8, 30);
        ctx.fillStyle = "#43a047";
        ctx.beginPath(); ctx.ellipse(-14, -14, 16, 6, -0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(14, -14, 16, 6, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(0, -20, 15, 6, 0, 0, Math.PI * 2); ctx.fill();
    }

    ctx.restore();
}

function drawPlayer() {
    const biome = getBiome(player.x, player.y);
    const inWater = biome.id === "sea";

    ctx.save();
    ctx.translate(player.x, player.y);

    const legSwing = Math.sin(player.walkAnim) * 6;

    if (!inWater) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        ctx.beginPath(); ctx.ellipse(0, 22, 15, 6, 0, 0, Math.PI * 2); ctx.fill();

        // Oyoqlar
        ctx.fillStyle = "#263238";
        ctx.fillRect(-7, 10 + legSwing * 0.4, 5, 12);
        ctx.fillRect(2, 10 - legSwing * 0.4, 5, 12);
    }

    // Tana
    ctx.fillStyle = "#2196f3";
    ctx.beginPath(); ctx.roundRect(-10, -6, 20, 17, 5); ctx.fill();
    ctx.strokeStyle = "#111"; ctx.lineWidth = 1.5; ctx.stroke();

    // Bosh
    ctx.fillStyle = "#ffdbac";
    ctx.beginPath(); ctx.arc(0, -14, 9.5, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

    // Soch
    ctx.fillStyle = "#3e2723";
    ctx.beginPath(); ctx.arc(0, -17, 10, Math.PI, Math.PI * 2); ctx.fill();

    // Ko'zlar
    ctx.fillStyle = "#000";
    ctx.beginPath();
    ctx.arc(-3 + player.dirX * 2, -14 + player.dirY * 1.5, 1.5, 0, Math.PI * 2);
    ctx.arc(3 + player.dirX * 2, -14 + player.dirY * 1.5, 1.5, 0, Math.PI * 2);
    ctx.fill();

    // Dengizda bo'lsa suv halqasi
    if (inWater) {
        ctx.strokeStyle = "rgba(255,255,255,0.75)";
        ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.ellipse(0, 6, 18, 7, 0, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.restore();
}

function drawMinimap() {
    const size = 120;
    const mx = canvas.width - size - 12;
    const my = 12;

    ctx.save();
    ctx.translate(mx, my);

    // Minixaritada 5 ta zona ko'rinishi
    ctx.fillStyle = "#2e6930"; ctx.fillRect(0, 0, size, size); // O'rmon
    ctx.fillStyle = "#e6c27a"; ctx.fillRect(0, size * 0.25, size * 0.28, size * 0.5); // Cho'l
    ctx.fillStyle = "#546e7a"; ctx.fillRect(size * 0.72, size * 0.25, size * 0.28, size * 0.5); // Shahar
    ctx.fillStyle = "#eceff1"; ctx.fillRect(0, 0, size, size * 0.25); // Qorli tog'
    ctx.fillStyle = "#0288d1"; ctx.fillRect(0, size * 0.75, size, size * 0.25); // Dengiz

    ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
    ctx.strokeRect(0, 0, size, size);

    // Qahramon nuqtasi
    ctx.fillStyle = "#ff1744";
    ctx.beginPath();
    ctx.arc((player.x / WORLD_SIZE) * size, (player.y / WORLD_SIZE) * size, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();

    ctx.restore();
}

function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const camX = player.x - canvas.width / 2;
    const camY = player.y - canvas.height / 2;

    ctx.save();
    ctx.translate(-camX, -camY);

    drawWorldZones();
    decor.forEach(drawDecorItem);
    drawPlayer();

    ctx.restore();

    drawMinimap();
}

function loop() {
    update();
    render();
    requestAnimationFrame(loop);
}

generateWorld();
loop();
</script>
</body>
</html>
